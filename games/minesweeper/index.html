<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Minesweeper — Arcade Collection</title>
<link rel="stylesheet" href="../../shared/style.css" />
<style>
  #grid { display: grid; gap: 3px; width: 100%; max-width: 400px; touch-action: manipulation; }
  .cell {
    aspect-ratio: 1/1;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(10px, 3.4vw, 16px);
    font-weight: 700;
    cursor: pointer;
    user-select: none;
  }
  .cell.open { background: rgba(255,255,255,0.03); cursor: default; }
  .cell.mine { background: rgba(255,92,108,0.35); }
  .cell.flag { background: rgba(255,225,125,0.18); }
  .n1 { color: #4fd1ff; } .n2 { color: #7cf7c9; } .n3 { color: #ff9a62; }
  .n4 { color: #c77dff; } .n5 { color: #ff5c6c; } .n6 { color: #ffe17d; } .n7, .n8 { color: #fff; }
  .toolbar { display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-link" href="../../index.html">&larr; Arcade</a>
    <h1 class="game-title">MINESWEEPER</h1>
    <button class="back-link" id="muteBtn">Mute</button>
  </div>
  <div class="hud">
    <div>MINES LEFT <strong id="minesLeft">12</strong></div>
    <div>TIME <strong id="time">0:00</strong></div>
    <div>BEST <strong id="best">&mdash;</strong></div>
  </div>
  <div class="toolbar">
    <button class="btn secondary" id="flagModeBtn">Flag Mode: Off</button>
    <button class="btn secondary" id="newGameBtn">New Game</button>
  </div>
  <div class="stage" id="stage">
    <div id="grid"></div>
    <div class="overlay" id="overlay">
      <h2>MINESWEEPER</h2>
      <p>10&times;10 grid, 12 mines. Tap to reveal, use Flag Mode (or right-click) to flag. Clear every safe cell to win.</p>
      <button class="btn" id="startBtn">Start</button>
    </div>
  </div>
</div>
<script src="../../shared/sound.js"></script>
<script>
const SIZE = 10, MINES = 12;
const gridEl = document.getElementById("grid");
const overlay = document.getElementById("overlay");
const minesLeftEl = document.getElementById("minesLeft");
const timeEl = document.getElementById("time");
const bestEl = document.getElementById("best");
const muteBtn = document.getElementById("muteBtn");
const flagModeBtn = document.getElementById("flagModeBtn");

let board, cellsEl, running, flagMode, firstClick, startTime, timerId, revealedCount;

gridEl.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;

function neighbors(r, c) {
  const out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (dr === 0 && dc === 0) continue;
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) out.push([nr, nc]);
  }
  return out;
}

function buildBoard(avoidR, avoidC) {
  board = Array.from({ length: SIZE }, () => Array.from({ length: SIZE }, () => ({ mine: false, count: 0, open: false, flag: false })));
  let placed = 0;
  while (placed < MINES) {
    const r = Math.floor(Math.random() * SIZE);
    const c = Math.floor(Math.random() * SIZE);
    if (board[r][c].mine) continue;
    if (Math.abs(r - avoidR) <= 1 && Math.abs(c - avoidC) <= 1) continue;
    board[r][c].mine = true;
    placed++;
  }
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    if (board[r][c].mine) continue;
    board[r][c].count = neighbors(r, c).filter(([nr, nc]) => board[nr][nc].mine).length;
  }
}

function render() {
  gridEl.innerHTML = "";
  cellsEl = [];
  for (let r = 0; r < SIZE; r++) {
    const row = [];
    for (let c = 0; c < SIZE; c++) {
      const d = document.createElement("div");
      d.className = "cell";
      d.addEventListener("click", () => handleReveal(r, c));
      d.addEventListener("contextmenu", (e) => { e.preventDefault(); handleFlag(r, c); });
      gridEl.appendChild(d);
      row.push(d);
    }
    cellsEl.push(row);
  }
}

function updateCell(r, c) {
  const cell = board[r][c];
  const el = cellsEl[r][c];
  el.className = "cell";
  el.textContent = "";
  if (cell.flag && !cell.open) {
    el.classList.add("flag");
    el.textContent = "🚩";
  } else if (cell.open) {
    el.classList.add("open");
    if (cell.mine) {
      el.classList.add("mine");
      el.textContent = "💣";
    } else if (cell.count > 0) {
      el.textContent = cell.count;
      el.classList.add("n" + cell.count);
    }
  }
}

function handleFlag(r, c) {
  if (!running) return;
  const cell = board[r][c];
  if (cell.open) return;
  cell.flag = !cell.flag;
  updateCell(r, c);
  updateMineCounter();
  Sound.click();
}

function handleReveal(r, c) {
  if (!running) return;
  if (flagMode) { handleFlag(r, c); return; }
  const cell = board[r][c];
  if (cell.flag || cell.open) return;

  if (firstClick) {
    firstClick = false;
    buildBoard(r, c);
    startTime = Date.now();
    timerId = setInterval(() => { timeEl.textContent = formatTime(Date.now() - startTime); }, 1000);
  }

  reveal(r, c);
  if (board[r][c].mine) {
    loseGame(r, c);
    return;
  }
  checkWin();
}

function reveal(r, c) {
  const cell = board[r][c];
  if (cell.open || cell.flag) return;
  cell.open = true;
  revealedCount++;
  updateCell(r, c);
  if (!cell.mine && cell.count === 0) {
    neighbors(r, c).forEach(([nr, nc]) => reveal(nr, nc));
  }
}

function updateMineCounter() {
  const flagged = board.flat().filter((c) => c.flag).length;
  minesLeftEl.textContent = Math.max(0, MINES - flagged);
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function loseGame(hitR, hitC) {
  running = false;
  clearInterval(timerId);
  Sound.bad();
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    if (board[r][c].mine) { board[r][c].open = true; updateCell(r, c); }
  }
  overlay.innerHTML = `<h2>Boom!</h2><p>Hit a mine. Try again?</p><button class="btn" id="startBtn2">Try Again</button>`;
  overlay.style.display = "flex";
  document.getElementById("startBtn2").addEventListener("click", start);
}

function checkWin() {
  const safeCells = SIZE * SIZE - MINES;
  if (revealedCount === safeCells) {
    running = false;
    clearInterval(timerId);
    Sound.win();
    const elapsed = Date.now() - startTime;
    const bestKey = "minesweeper-best";
    const prevBest = Number(localStorage.getItem(bestKey) || Infinity);
    let note = "";
    if (elapsed < prevBest) {
      localStorage.setItem(bestKey, String(elapsed));
      bestEl.textContent = formatTime(elapsed);
      note = " — New best!";
    }
    overlay.innerHTML = `<h2>Cleared!</h2><p>Solved in ${formatTime(elapsed)}${note}</p><button class="btn" id="startBtn2">Play Again</button>`;
    overlay.style.display = "flex";
    document.getElementById("startBtn2").addEventListener("click", start);
  }
}

function start() {
  Sound.init();
  overlay.style.display = "none";
  firstClick = true;
  revealedCount = 0;
  running = true;
  clearInterval(timerId);
  timeEl.textContent = "0:00";
  minesLeftEl.textContent = MINES;
  board = Array.from({ length: SIZE }, () => Array.from({ length: SIZE }, () => ({ mine: false, count: 0, open: false, flag: false })));
  render();
}

flagModeBtn.addEventListener("click", () => {
  flagMode = !flagMode;
  flagModeBtn.textContent = "Flag Mode: " + (flagMode ? "On" : "Off");
});
document.getElementById("newGameBtn").addEventListener("click", start);
document.getElementById("startBtn").addEventListener("click", start);
muteBtn.addEventListener("click", () => {
  Sound.setMuted(!Sound.isMuted());
  muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";
});
muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";

const prevBest = localStorage.getItem("minesweeper-best");
bestEl.textContent = prevBest ? formatTime(Number(prevBest)) : "—";
render();
</script>
<script src="../../shared/ads.js"></script>
</body>
</html>
