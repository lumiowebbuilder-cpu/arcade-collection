<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Battleship — Arcade Collection</title>
<link rel="stylesheet" href="../../shared/style.css" />
<style>
  .board-label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); text-align: center; margin-bottom: 4px; }
  .bgrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; width: 100%; max-width: 360px; margin: 0 auto; }
  .bcell {
    aspect-ratio: 1/1; border-radius: 4px; background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer;
  }
  .bcell.ship { background: rgba(124,247,201,0.28); }
  .bcell.hit { background: #ff5c6c; }
  .bcell.miss { background: rgba(255,255,255,0.15); cursor: default; }
  .bcell.sunk { background: #7a1f28; }
  #enemyGrid .bcell:hover:not(.hit):not(.miss) { background: rgba(124,247,201,0.15); }
  .board-block { width: 100%; max-width: 360px; margin: 0 auto 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-link" href="../../index.html">&larr; Arcade</a>
    <h1 class="game-title">BATTLESHIP</h1>
    <button class="back-link" id="muteBtn">Mute</button>
  </div>
  <div class="hud">
    <div>YOUR HITS <strong id="playerHits">0</strong>/14</div>
    <div>ENEMY HITS <strong id="aiHits">0</strong>/14</div>
    <div>RECORD <strong id="record">0-0</strong></div>
  </div>
  <div class="stage" id="stage" style="min-height: 480px;">
    <div>
      <div class="board-block">
        <div class="board-label">Enemy Waters &mdash; tap to fire</div>
        <div class="bgrid" id="enemyGrid"></div>
      </div>
      <div class="board-block">
        <div class="board-label">Your Fleet</div>
        <div class="bgrid" id="playerGrid"></div>
      </div>
    </div>
    <div class="overlay" id="overlay">
      <h2>BATTLESHIP</h2>
      <p>Fleets are placed automatically. Sink all 4 enemy ships (sizes 5, 4, 3, 2) before the AI sinks yours. It hunts smarter after each hit.</p>
      <button class="btn" id="startBtn">Deploy</button>
    </div>
  </div>
</div>
<script src="../../shared/sound.js"></script>
<script>
const SIZE = 8;
const FLEET = [5, 4, 3, 2];
const enemyGridEl = document.getElementById("enemyGrid");
const playerGridEl = document.getElementById("playerGrid");
const overlay = document.getElementById("overlay");
const playerHitsEl = document.getElementById("playerHits");
const aiHitsEl = document.getElementById("aiHits");
const recordEl = document.getElementById("record");
const muteBtn = document.getElementById("muteBtn");

let playerShips, aiShips, playerShots, aiShots, aiState, running, wins, losses, totalCells;

function emptyGrid() { return Array.from({ length: SIZE }, () => Array(SIZE).fill(null)); }

function placeFleet() {
  const board = Array.from({ length: SIZE }, () => Array(SIZE).fill(-1));
  const ships = [];
  FLEET.forEach((size, id) => {
    let placed = false;
    while (!placed) {
      const horizontal = Math.random() < 0.5;
      const r = Math.floor(Math.random() * SIZE);
      const c = Math.floor(Math.random() * SIZE);
      const cells = [];
      let fits = true;
      for (let i = 0; i < size; i++) {
        const rr = horizontal ? r : r + i;
        const cc = horizontal ? c + i : c;
        if (rr >= SIZE || cc >= SIZE || board[rr][cc] !== -1) { fits = false; break; }
        cells.push([rr, cc]);
      }
      if (fits) {
        cells.forEach(([rr, cc]) => (board[rr][cc] = id));
        ships.push({ id, size, cells, hits: 0, sunk: false });
        placed = true;
      }
    }
  });
  return { board, ships };
}

function buildGrid(el, interactive) {
  el.innerHTML = "";
  const cells = [];
  for (let r = 0; r < SIZE; r++) {
    const row = [];
    for (let c = 0; c < SIZE; c++) {
      const d = document.createElement("div");
      d.className = "bcell";
      if (interactive) d.addEventListener("click", () => onEnemyCellClick(r, c));
      el.appendChild(d);
      row.push(d);
    }
    cells.push(row);
  }
  return cells;
}

function renderBoard(cellEls, shots, ships, revealShips) {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = cellEls[r][c];
      cell.className = "bcell";
      const shot = shots[r][c];
      const shipId = ships.board[r][c];
      if (shot === "hit") {
        const ship = ships.ships[shipId];
        cell.classList.add(ship.sunk ? "sunk" : "hit");
      } else if (shot === "miss") {
        cell.classList.add("miss");
      } else if (revealShips && shipId !== -1) {
        cell.classList.add("ship");
      }
    }
  }
}

function attack(shots, ships, r, c) {
  if (shots[r][c]) return null;
  const shipId = ships.board[r][c];
  if (shipId === -1) { shots[r][c] = "miss"; return { hit: false }; }
  shots[r][c] = "hit";
  const ship = ships.ships[shipId];
  ship.hits++;
  if (ship.hits >= ship.size) ship.sunk = true;
  return { hit: true, sunk: ship.sunk, shipId };
}

function onEnemyCellClick(r, c) {
  if (!running || aiShots.turnLock) return;
  if (playerShots[r][c]) return;
  const result = attack(playerShots, aiShips, r, c);
  if (!result) return;
  Sound[result.hit ? "coin" : "click"]();
  renderBoard(enemyCells, playerShots, aiShips, false);
  updateHud();
  if (result.hit && result.sunk) Sound.good();

  if (aiShips.ships.every((s) => s.sunk)) { endGame(true); return; }

  aiShots.turnLock = true;
  setTimeout(aiTurn, 350);
}

function aiTurn() {
  let target = null;
  while (aiState.queue.length) {
    const cand = aiState.queue.shift();
    if (!playerShots[cand[0]][cand[1]]) { target = cand; break; }
  }
  if (!target) {
    const options = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!playerShots[r][c]) options.push([r, c]);
    target = options[Math.floor(Math.random() * options.length)];
  }
  const [r, c] = target;
  const result = attack(playerShots, playerShips, r, c);
  Sound[result.hit ? "bad" : "click"]();
  if (result.hit && !result.sunk) {
    for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && !playerShots[nr][nc]) aiState.queue.push([nr, nc]);
    }
  }
  renderBoard(playerCells, playerShots, playerShips, true);
  updateHud();
  aiShots.turnLock = false;

  if (playerShips.ships.every((s) => s.sunk)) { endGame(false); return; }
}

function updateHud() {
  const playerHitCount = playerShots.flat().filter((v) => v === "hit").length;
  const aiHitCount = aiShots.flat().filter((v) => v === "hit").length;
  playerHitsEl.textContent = playerHitCount;
  aiHitsEl.textContent = aiHitCount;
  recordEl.textContent = `${wins}-${losses}`;
}

let enemyCells, playerCells;

function endGame(won) {
  running = false;
  Sound[won ? "win" : "bad"]();
  if (won) wins++; else losses++;
  localStorage.setItem("battleship-record", JSON.stringify({ wins, losses }));
  renderBoard(enemyCells, playerShots, aiShips, true);
  updateHud();
  overlay.innerHTML = `<h2>${won ? "Victory!" : "Fleet Sunk"}</h2><p>${won ? "You sank the enemy fleet." : "The AI sank your fleet."}</p><button class="btn" id="startBtn2">Play Again</button>`;
  overlay.style.display = "flex";
  document.getElementById("startBtn2").addEventListener("click", start);
}

function start() {
  Sound.init();
  overlay.style.display = "none";
  playerShips = placeFleet();
  aiShips = placeFleet();
  playerShots = emptyGrid();
  aiShots = emptyGrid();
  aiShots.turnLock = false;
  aiState = { queue: [] };
  running = true;
  renderBoard(enemyCells, playerShots, aiShips, false);
  renderBoard(playerCells, playerShots, playerShips, true);
  updateHud();
}

document.getElementById("startBtn").addEventListener("click", start);
muteBtn.addEventListener("click", () => {
  Sound.setMuted(!Sound.isMuted());
  muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";
});
muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";

const saved = JSON.parse(localStorage.getItem("battleship-record") || "{}");
wins = saved.wins || 0; losses = saved.losses || 0;
recordEl.textContent = `${wins}-${losses}`;
enemyCells = buildGrid(enemyGridEl, true);
playerCells = buildGrid(playerGridEl, false);
playerShots = emptyGrid();
aiShots = emptyGrid();
</script>
</body>
</html>
