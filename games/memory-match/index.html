<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Memory Match — Arcade Collection</title>
<link rel="stylesheet" href="../../shared/style.css" />
<style>
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 400px; }
  .card {
    aspect-ratio: 1/1;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(20px, 6vw, 34px);
    cursor: pointer;
    user-select: none;
    perspective: 600px;
  }
  .card .inner { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transition: transform 0.35s; transform-style: preserve-3d; position: relative; }
  .card .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; border-radius: 12px; }
  .card .back { background: rgba(255,255,255,0.05); font-size: 20px; color: var(--text-dim); }
  .card .front { background: rgba(124,247,201,0.12); transform: rotateY(180deg); }
  .card.flipped .inner, .card.matched .inner { transform: rotateY(180deg); }
  .card.matched { opacity: 0.55; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-link" href="../../index.html">&larr; Arcade</a>
    <h1 class="game-title">MEMORY MATCH</h1>
    <button class="back-link" id="muteBtn">Mute</button>
  </div>
  <div class="hud">
    <div>MOVES <strong id="moves">0</strong></div>
    <div>TIME <strong id="time">0:00</strong></div>
    <div>BEST <strong id="best">&mdash;</strong></div>
  </div>
  <div class="stage" id="stage">
    <div id="grid"></div>
    <div class="overlay" id="overlay">
      <h2>MEMORY MATCH</h2>
      <p>Flip two cards at a time. Match all 8 pairs in as few moves as possible.</p>
      <button class="btn" id="startBtn">Start</button>
    </div>
  </div>
</div>
<script src="../../shared/sound.js"></script>
<script>
const SYMBOLS = ["🚀","🪐","⭐","🌙","🛸","☄️","🌌","🔭"];
const gridEl = document.getElementById("grid");
const overlay = document.getElementById("overlay");
const movesEl = document.getElementById("moves");
const timeEl = document.getElementById("time");
const bestEl = document.getElementById("best");
const muteBtn = document.getElementById("muteBtn");

let cards, flipped, matchedCount, moves, startTime, timerId, locked, running;

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function render() {
  gridEl.innerHTML = "";
  cards.forEach((symbol, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.i = i;
    card.innerHTML = `<div class="inner"><div class="face back">?</div><div class="face front">${symbol}</div></div>`;
    card.addEventListener("click", () => onFlip(i, card));
    gridEl.appendChild(card);
  });
}

function onFlip(i, el) {
  if (locked || !running) return;
  if (flipped.some((f) => f.i === i)) return;
  if (el.classList.contains("matched")) return;
  el.classList.add("flipped");
  Sound.click();
  flipped.push({ i, el });
  if (flipped.length === 2) {
    moves++;
    movesEl.textContent = moves;
    const [a, b] = flipped;
    if (cards[a.i] === cards[b.i]) {
      a.el.classList.add("matched");
      b.el.classList.add("matched");
      matchedCount++;
      Sound.good();
      flipped = [];
      if (matchedCount === SYMBOLS.length) finish();
    } else {
      locked = true;
      setTimeout(() => {
        a.el.classList.remove("flipped");
        b.el.classList.remove("flipped");
        flipped = [];
        locked = false;
      }, 700);
    }
  }
}

function finish() {
  running = false;
  clearInterval(timerId);
  const elapsed = Date.now() - startTime;
  Sound.win();
  const bestKey = "memory-best";
  const prevBest = Number(localStorage.getItem(bestKey) || Infinity);
  let bestNote = "";
  if (moves < prevBest) {
    localStorage.setItem(bestKey, String(moves));
    bestNote = " — New best!";
    bestEl.textContent = moves;
  }
  overlay.innerHTML = `<h2>Solved!</h2><p>${moves} moves in ${formatTime(elapsed)}${bestNote}</p><button class="btn" id="startBtn2">Play Again</button>`;
  overlay.style.display = "flex";
  document.getElementById("startBtn2").addEventListener("click", start);
}

function start() {
  Sound.init();
  overlay.style.display = "none";
  cards = shuffled([...SYMBOLS, ...SYMBOLS]);
  flipped = [];
  matchedCount = 0;
  moves = 0;
  locked = false;
  running = true;
  movesEl.textContent = 0;
  startTime = Date.now();
  clearInterval(timerId);
  timerId = setInterval(() => { timeEl.textContent = formatTime(Date.now() - startTime); }, 1000);
  timeEl.textContent = "0:00";
  render();
}

document.getElementById("startBtn").addEventListener("click", start);
muteBtn.addEventListener("click", () => {
  Sound.setMuted(!Sound.isMuted());
  muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";
});
muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";

const prevBest = localStorage.getItem("memory-best");
bestEl.textContent = prevBest ? prevBest : "—";
</script>
<script src="../../shared/ads.js"></script>
</body>
</html>
