<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Snake — Arcade Collection</title>
<link rel="stylesheet" href="../../shared/style.css" />
<style>
  #stage { aspect-ratio: 1 / 1; width: 100%; max-width: 480px; }
  #board { width: 100%; height: 100%; }
  .touch-pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 6px; }
  .touch-pad button { border: 1px solid var(--panel-border); background: var(--panel); color: var(--text); border-radius: 10px; font-size: 18px; }
  .touch-pad button:active { background: rgba(124,247,201,0.25); }
  @media (min-width: 620px) { .touch-pad { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-link" href="../../index.html">&larr; Arcade</a>
    <h1 class="game-title">SNAKE</h1>
    <button class="back-link" id="muteBtn">Mute</button>
  </div>
  <div class="hud">
    <div>SCORE <strong id="score">0</strong></div>
    <div>BEST <strong id="best">0</strong></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <h2>SNAKE</h2>
      <p>Arrow keys or WASD to steer. Eat the orbs, don't hit yourself or the wall.</p>
      <button class="btn" id="startBtn">Start</button>
    </div>
  </div>
  <div class="touch-pad" id="pad">
    <span></span><button data-d="up">&uarr;</button><span></span>
    <button data-d="left">&larr;</button><span></span><button data-d="right">&rarr;</button>
    <span></span><button data-d="down">&darr;</button><span></span>
  </div>
  <p class="hint">Speed increases as you grow. Press Space to pause.</p>
</div>
<script src="../../shared/sound.js"></script>
<script>
const GRID = 20;
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const startBtn = document.getElementById("startBtn");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const muteBtn = document.getElementById("muteBtn");

let cell, snake, dir, nextDir, food, score, best, speedMs, timer, running, paused;

function resize() {
  const size = Math.min(canvas.parentElement.clientWidth, canvas.parentElement.clientHeight) || 480;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + "px";
  canvas.style.height = size + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cell = size / GRID;
  draw();
}
window.addEventListener("resize", resize);

function reset() {
  snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  speedMs = 140;
  paused = false;
  placeFood();
  scoreEl.textContent = "0";
  best = Number(localStorage.getItem("snake-best") || 0);
  bestEl.textContent = best;
}

function placeFood() {
  while (true) {
    const f = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    if (!snake.some((s) => s.x === f.x && s.y === f.y)) {
      food = f;
      return;
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#05061a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!snake) return;

  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  for (let i = 1; i < GRID; i++) {
    ctx.beginPath();
    ctx.moveTo(i * cell, 0);
    ctx.lineTo(i * cell, GRID * cell);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * cell);
    ctx.lineTo(GRID * cell, i * cell);
    ctx.stroke();
  }

  ctx.shadowColor = "#ffe17d";
  ctx.shadowBlur = 14;
  ctx.fillStyle = "#ffe17d";
  ctx.beginPath();
  ctx.arc((food.x + 0.5) * cell, (food.y + 0.5) * cell, cell * 0.32, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#7cf7c9" : "rgba(124,247,201,0.75)";
    ctx.shadowColor = "#7cf7c9";
    ctx.shadowBlur = i === 0 ? 12 : 4;
    const pad = 1.5;
    ctx.beginPath();
    ctx.roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, 4);
    ctx.fill();
  });
  ctx.shadowBlur = 0;
}

function tick() {
  if (paused) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID || snake.some((s) => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    Sound.coin();
    speedMs = Math.max(60, speedMs - 3);
    placeFood();
    restartTimer();
  } else {
    snake.pop();
  }
  draw();
}

function restartTimer() {
  clearInterval(timer);
  timer = setInterval(tick, speedMs);
}

function gameOver() {
  running = false;
  clearInterval(timer);
  Sound.bad();
  if (score > best) {
    best = score;
    localStorage.setItem("snake-best", String(best));
  }
  bestEl.textContent = best;
  overlay.innerHTML = `<h2>Game Over</h2><p>Score: ${score}${score >= best && score > 0 ? " — New best!" : ""}</p><button class="btn" id="startBtn2">Try Again</button>`;
  overlay.style.display = "flex";
  document.getElementById("startBtn2").addEventListener("click", start);
}

function start() {
  Sound.init();
  overlay.style.display = "none";
  reset();
  running = true;
  draw();
  restartTimer();
}

function setDir(x, y) {
  if (!running) return;
  if (dir.x === -x && dir.y === -y) return;
  if ((dir.x === x && dir.y === y)) return;
  nextDir = { x, y };
  Sound.move();
}

window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d", " "].includes(k)) e.preventDefault();
  if (k === "arrowup" || k === "w") setDir(0, -1);
  else if (k === "arrowdown" || k === "s") setDir(0, 1);
  else if (k === "arrowleft" || k === "a") setDir(-1, 0);
  else if (k === "arrowright" || k === "d") setDir(1, 0);
  else if (k === " " && running) {
    paused = !paused;
  }
});

document.getElementById("pad").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-d]");
  if (!btn) return;
  const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  setDir(...map[btn.dataset.d]);
});

startBtn.addEventListener("click", start);
muteBtn.addEventListener("click", () => {
  Sound.setMuted(!Sound.isMuted());
  muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";
});
muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";

document.addEventListener("visibilitychange", () => {
  if (document.hidden && running) paused = true;
});

resize();
best = Number(localStorage.getItem("snake-best") || 0);
bestEl.textContent = best;
</script>
<script src="../../shared/ads.js"></script>
</body>
</html>
