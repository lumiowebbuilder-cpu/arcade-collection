<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Sliding Puzzle — Arcade Collection</title>
<link rel="stylesheet" href="../../shared/style.css" />
<style>
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 360px; aspect-ratio: 1/1; }
  .tile {
    border-radius: 10px; background: linear-gradient(160deg, rgba(124,247,201,0.25), rgba(124,247,201,0.08));
    border: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: center;
    font-size: clamp(18px, 6vw, 28px); font-weight: 800; cursor: pointer; transition: transform 0.08s;
  }
  .tile:active { transform: scale(0.95); }
  .tile.blank { background: transparent; border: none; cursor: default; }
  .controls-row { display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-link" href="../../index.html">&larr; Arcade</a>
    <h1 class="game-title">SLIDING PUZZLE</h1>
    <button class="back-link" id="muteBtn">Mute</button>
  </div>
  <div class="hud">
    <div>MOVES <strong id="moves">0</strong></div>
    <div>TIME <strong id="time">0:00</strong></div>
    <div>BEST <strong id="best">&mdash;</strong></div>
  </div>
  <div class="stage" id="stage" style="min-height: 400px;">
    <div id="grid"></div>
    <div class="overlay" id="overlay">
      <h2>SLIDING PUZZLE</h2>
      <p>Slide tiles into the empty space to put them back in order, 1 through 15.</p>
      <button class="btn" id="startBtn">Shuffle &amp; Start</button>
    </div>
  </div>
</div>
<script src="../../shared/sound.js"></script>
<script>
const SIZE = 4;
const gridEl = document.getElementById("grid");
const overlay = document.getElementById("overlay");
const movesEl = document.getElementById("moves");
const timeEl = document.getElementById("time");
const bestEl = document.getElementById("best");
const muteBtn = document.getElementById("muteBtn");

let board, moves, running, startTime, timerId, best;

function solvedBoard() {
  const b = [];
  for (let i = 1; i < SIZE * SIZE; i++) b.push(i);
  b.push(0);
  return b;
}
function isSolved(b) { return b.every((v, i) => v === solvedBoard()[i]); }
function blankIndex(b) { return b.indexOf(0); }

function neighborsOf(idx) {
  const r = Math.floor(idx / SIZE), c = idx % SIZE;
  const out = [];
  if (r > 0) out.push(idx - SIZE);
  if (r < SIZE - 1) out.push(idx + SIZE);
  if (c > 0) out.push(idx - 1);
  if (c < SIZE - 1) out.push(idx + 1);
  return out;
}

function shuffledBoard(steps) {
  const b = solvedBoard();
  let blank = blankIndex(b);
  let lastSwap = -1;
  for (let i = 0; i < steps; i++) {
    const opts = neighborsOf(blank).filter((n) => n !== lastSwap);
    const pick = opts[Math.floor(Math.random() * opts.length)];
    [b[blank], b[pick]] = [b[pick], b[blank]];
    lastSwap = blank;
    blank = pick;
  }
  return b;
}

function slideTile(tileIdx) {
  if (!running) return;
  const blank = blankIndex(board);
  if (!neighborsOf(blank).includes(tileIdx)) return;
  [board[blank], board[tileIdx]] = [board[tileIdx], board[blank]];
  moves++;
  Sound.click();
  render();
  if (isSolved(board)) win();
}

function render() {
  gridEl.innerHTML = "";
  board.forEach((v, i) => {
    const t = document.createElement("div");
    t.className = "tile" + (v === 0 ? " blank" : "");
    t.textContent = v === 0 ? "" : v;
    if (v !== 0) t.addEventListener("click", () => slideTile(i));
    gridEl.appendChild(t);
  });
  movesEl.textContent = moves;
  bestEl.textContent = best ? best : "—";
}

function win() {
  running = false;
  clearInterval(timerId);
  Sound.win();
  const elapsed = Date.now() - startTime;
  let note = "";
  if (!best || moves < best) { best = moves; localStorage.setItem("slidingpuzzle-best", String(best)); note = " — New best!"; }
  overlay.innerHTML = `<h2>Solved!</h2><p>${moves} moves in ${formatTime(elapsed)}${note}</p><button class="btn" id="startBtn2">Play Again</button>`;
  overlay.style.display = "flex";
  document.getElementById("startBtn2").addEventListener("click", start);
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function start() {
  Sound.init();
  overlay.style.display = "none";
  do { board = shuffledBoard(120); } while (isSolved(board));
  moves = 0;
  running = true;
  startTime = Date.now();
  clearInterval(timerId);
  timerId = setInterval(() => { timeEl.textContent = formatTime(Date.now() - startTime); }, 1000);
  timeEl.textContent = "0:00";
  render();
}

document.getElementById("startBtn").addEventListener("click", start);
muteBtn.addEventListener("click", () => {
  Sound.setMuted(!Sound.isMuted());
  muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";
});
muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";

best = Number(localStorage.getItem("slidingpuzzle-best") || 0) || null;
board = solvedBoard();
render();
</script>
<script src="../../shared/ads.js"></script>
</body>
</html>
