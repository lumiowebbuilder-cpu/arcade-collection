<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Rewind Runner — Arcade Collection</title>
<link rel="stylesheet" href="../../shared/style.css" />
<style>
  #stage { aspect-ratio: 4/3; width: 100%; max-width: 520px; touch-action: none; }
  .touch-controls { display: flex; justify-content: space-between; width: 100%; max-width: 520px; }
  .touch-controls button { border: 1px solid var(--panel-border); background: var(--panel); color: var(--text); border-radius: 10px; padding: 14px 20px; font-size: 18px; }
  .touch-controls button:active { background: rgba(124,247,201,0.25); }
  @media (min-width: 640px) { .touch-controls { display: none; } }
  #ghostBar { width: 100%; max-width: 520px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
  #ghostFill { height: 100%; background: linear-gradient(90deg,#c77dff,#4fd1ff); width: 0%; transition: width 0.1s linear; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-link" href="../../index.html">&larr; Arcade</a>
    <h1 class="game-title">REWIND RUNNER</h1>
    <button class="back-link" id="muteBtn">Mute</button>
  </div>
  <div class="hud">
    <div>LEVEL <strong id="levelNum">1</strong>/4</div>
    <div>GHOST IN <strong id="ghostIn">3.0s</strong></div>
    <div>BEST <strong id="best">0</strong>/4</div>
  </div>
  <div class="stage" id="stage">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <h2>REWIND RUNNER</h2>
      <p>Your ghost replays exactly what you did, 3 seconds late. Stand on a switch now so your future ghost holds the gate open for present-you later. Reach the flag.</p>
      <button class="btn" id="startBtn">Start</button>
    </div>
  </div>
  <div id="ghostBar"><div id="ghostFill"></div></div>
  <div class="touch-controls">
    <button id="leftBtn">&larr;</button>
    <button id="jumpBtn">JUMP</button>
    <button id="rightBtn">&rarr;</button>
  </div>
</div>
<script src="../../shared/sound.js"></script>
<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const levelNumEl = document.getElementById("levelNum");
const ghostInEl = document.getElementById("ghostIn");
const ghostFillEl = document.getElementById("ghostFill");
const bestEl = document.getElementById("best");
const muteBtn = document.getElementById("muteBtn");

const VIEW_W = 480, VIEW_H = 320;
const GRAVITY = 1500, MOVE_ACCEL = 2400, MAX_SPEED = 170, FRICTION = 2000, JUMP_V = -510;
const DELAY = 3.0;
const PLAYER_W = 18, PLAYER_H = 26;

const LEVELS = [
  {
    start: { x: 30, y: 250 },
    ground: [{ x: 0, y: 280, w: VIEW_W, h: 40 }],
    switches: [{ id: "s1", x: 70, y: 254, w: 30, h: 26 }],
    gates: [{ id: "g1", switchId: "s1", x: 300, y: 180, w: 18, h: 100 }],
    flag: { x: 430, y: 240 },
  },
  {
    start: { x: 30, y: 250 },
    ground: [{ x: 0, y: 280, w: VIEW_W, h: 40 }, { x: 340, y: 200, w: 140, h: 20 }],
    switches: [{ id: "s1", x: 60, y: 254, w: 30, h: 26 }],
    gates: [{ id: "g1", switchId: "s1", x: 250, y: 180, w: 18, h: 100 }],
    flag: { x: 440, y: 160 },
  },
  {
    start: { x: 30, y: 250 },
    ground: [{ x: 0, y: 280, w: 200, h: 40 }, { x: 260, y: 280, w: 220, h: 40 }],
    switches: [{ id: "s1", x: 70, y: 254, w: 30, h: 26 }],
    gates: [{ id: "g1", switchId: "s1", x: 200, y: 180, w: 60, h: 100 }],
    flag: { x: 440, y: 240 },
  },
  {
    start: { x: 30, y: 250 },
    ground: [{ x: 0, y: 280, w: VIEW_W, h: 40 }],
    switches: [{ id: "s1", x: 60, y: 254, w: 30, h: 26 }, { id: "s2", x: 220, y: 254, w: 30, h: 26 }],
    gates: [{ id: "g1", switchId: "s1", x: 160, y: 180, w: 18, h: 100 }, { id: "g2", switchId: "s2", x: 380, y: 180, w: 18, h: 100 }],
    flag: { x: 440, y: 240 },
  },
];

let level, player, ghost, history, elapsed, switches, gates, ground, flagPos, running, won, best;
const input = { left: false, right: false, jump: false };

function loadLevel(idx) {
  const L = LEVELS[idx];
  player = { x: L.start.x, y: L.start.y, w: PLAYER_W, h: PLAYER_H, vx: 0, vy: 0, onGround: false, facing: 1 };
  ground = L.ground;
  switches = L.switches.map((s) => ({ ...s }));
  gates = L.gates.map((g) => ({ ...g, open: false }));
  flagPos = L.flag;
  history = [];
  elapsed = 0;
  ghost = null;
  won = false;
}

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + "px";
  canvas.style.height = rect.height + "px";
  const scale = rect.width / VIEW_W;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  draw();
}
window.addEventListener("resize", resize);

function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function currentSolids() {
  return [...ground, ...gates.filter((g) => !g.open)];
}

function moveAndCollide(dt) {
  let accel = 0;
  if (input.left) { accel -= MOVE_ACCEL; player.facing = -1; }
  if (input.right) { accel += MOVE_ACCEL; player.facing = 1; }
  if (accel !== 0) player.vx += accel * dt;
  else { const s = Math.sign(player.vx); player.vx -= s * FRICTION * dt; if (Math.sign(player.vx) !== s) player.vx = 0; }
  player.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, player.vx));

  const solids = currentSolids();

  player.x += player.vx * dt;
  player.x = Math.max(0, Math.min(VIEW_W - player.w, player.x));
  for (const s of solids) {
    if (aabb(player.x, player.y, player.w, player.h, s.x, s.y, s.w, s.h)) {
      if (player.vx > 0) player.x = s.x - player.w;
      else if (player.vx < 0) player.x = s.x + s.w;
      player.vx = 0;
    }
  }

  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;
  player.onGround = false;
  for (const s of solids) {
    if (aabb(player.x, player.y, player.w, player.h, s.x, s.y, s.w, s.h)) {
      if (player.vy > 0) { player.y = s.y - player.h; player.vy = 0; player.onGround = true; }
      else if (player.vy < 0) { player.y = s.y + s.h; player.vy = 0; }
    }
  }
  if (input.jump && player.onGround) { player.vy = JUMP_V; player.onGround = false; Sound.move(); }
  if (player.y > VIEW_H + 60) { player.x = LEVELS[level].start.x; player.y = LEVELS[level].start.y; player.vx = 0; player.vy = 0; Sound.bad(); }
}

function updateGhost() {
  if (elapsed < DELAY || history.length === 0) { ghost = null; return; }
  const targetT = elapsed - DELAY;
  let lo = 0, hi = history.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (history[mid].t <= targetT) lo = mid; else hi = mid - 1;
  }
  const h = history[lo];
  ghost = { x: h.x, y: h.y, w: PLAYER_W, h: PLAYER_H };
}

function updateSwitches() {
  for (const g of gates) {
    const sw = switches.find((s) => s.id === g.switchId);
    if (!sw) continue;
    const playerOn = aabb(player.x, player.y, player.w, player.h, sw.x, sw.y, sw.w, sw.h);
    const ghostOn = ghost && aabb(ghost.x, ghost.y, ghost.w, ghost.h, sw.x, sw.y, sw.w, sw.h);
    const shouldOpen = playerOn || ghostOn;
    if (shouldOpen && !g.open) Sound.click();
    g.open = shouldOpen;
  }
}

function checkWin() {
  if (won) return;
  if (aabb(player.x, player.y, player.w, player.h, flagPos.x - 6, flagPos.y - 90, 12, 90)) {
    won = true;
    running = false;
    Sound.win();
    if (level + 1 > best) { best = level + 1; localStorage.setItem("rewindrunner-best", String(best)); }
    if (level >= LEVELS.length - 1) {
      overlay.innerHTML = `<h2>All levels cleared!</h2><p>You and your ghost make a good team.</p><button class="btn" id="startBtn2">Play Again</button>`;
      overlay.style.display = "flex";
      document.getElementById("startBtn2").addEventListener("click", start);
    } else {
      overlay.innerHTML = `<h2>Level ${level + 1} clear!</h2><p></p><button class="btn" id="nextBtn">Next Level</button>`;
      overlay.style.display = "flex";
      document.getElementById("nextBtn").addEventListener("click", () => {
        overlay.style.display = "none";
        level++;
        running = true;
        loadLevel(level);
      });
    }
    updateHud();
  }
}

function updateHud() {
  levelNumEl.textContent = level + 1;
  bestEl.textContent = best;
  if (elapsed < DELAY) {
    ghostInEl.textContent = (DELAY - elapsed).toFixed(1) + "s";
    ghostFillEl.style.width = (elapsed / DELAY) * 100 + "%";
  } else {
    ghostInEl.textContent = "active";
    ghostFillEl.style.width = "100%";
  }
}

function update(dt) {
  if (!running) return;
  elapsed += dt;
  moveAndCollide(dt);
  history.push({ t: elapsed, x: player.x, y: player.y });
  updateGhost();
  updateSwitches();
  checkWin();
  updateHud();
}

function draw() {
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  const bg = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  bg.addColorStop(0, "#0b0f2a"); bg.addColorStop(1, "#160a29");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  if (!player) return;

  ctx.fillStyle = "#1c2550";
  for (const g of ground) ctx.fillRect(g.x, g.y, g.w, g.h);

  ctx.fillStyle = "#ffe17d";
  for (const s of switches) ctx.fillRect(s.x, s.y + s.h - 6, s.w, 6);

  for (const g of gates) {
    if (g.open) continue;
    ctx.fillStyle = "#ff5c6c";
    ctx.shadowColor = "#ff5c6c"; ctx.shadowBlur = 6;
    ctx.fillRect(g.x, g.y, g.w, g.h);
    ctx.shadowBlur = 0;
  }

  ctx.fillStyle = "#7cf7c9";
  ctx.shadowColor = "#7cf7c9"; ctx.shadowBlur = 10;
  ctx.fillRect(flagPos.x, flagPos.y - 90, 5, 90);
  ctx.beginPath();
  ctx.moveTo(flagPos.x + 5, flagPos.y - 90);
  ctx.lineTo(flagPos.x + 34, flagPos.y - 78);
  ctx.lineTo(flagPos.x + 5, flagPos.y - 66);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;

  if (ghost) {
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = "#c77dff";
    ctx.shadowColor = "#c77dff"; ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.roundRect(ghost.x, ghost.y, ghost.w, ghost.h, 5);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = "#4fd1ff";
  ctx.shadowColor = "#4fd1ff"; ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.roundRect(player.x, player.y, player.w, player.h, 5);
  ctx.fill();
  ctx.shadowBlur = 0;
}

let lastTime;
function loop(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.033);
  lastTime = t;
  update(dt);
  draw();
  if (running) requestAnimationFrame(loop);
}

function start() {
  Sound.init();
  overlay.style.display = "none";
  level = 0;
  running = true;
  loadLevel(0);
  updateHud();
  draw();
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (["arrowleft","arrowright","arrowup"," ","w","a","d"].includes(k)) e.preventDefault();
  if (k === "arrowleft" || k === "a") input.left = true;
  else if (k === "arrowright" || k === "d") input.right = true;
  else if (k === "arrowup" || k === "w" || k === " ") input.jump = true;
});
window.addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (k === "arrowleft" || k === "a") input.left = false;
  else if (k === "arrowright" || k === "d") input.right = false;
  else if (k === "arrowup" || k === "w" || k === " ") input.jump = false;
});
function bindHold(el, onDown, onUp) {
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); onDown(); });
  ["pointerup","pointerleave","pointercancel"].forEach((ev) => el.addEventListener(ev, onUp));
}
bindHold(document.getElementById("leftBtn"), () => (input.left = true), () => (input.left = false));
bindHold(document.getElementById("rightBtn"), () => (input.right = true), () => (input.right = false));
bindHold(document.getElementById("jumpBtn"), () => (input.jump = true), () => (input.jump = false));

document.getElementById("startBtn").addEventListener("click", start);
muteBtn.addEventListener("click", () => {
  Sound.setMuted(!Sound.isMuted());
  muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";
});
muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";

document.addEventListener("visibilitychange", () => {
  if (document.hidden && running) { running = false; overlay.innerHTML = `<h2>Paused</h2><p></p><button class="btn" id="resumeBtn">Resume</button>`; overlay.style.display = "flex"; document.getElementById("resumeBtn").addEventListener("click", () => { overlay.style.display = "none"; running = true; lastTime = performance.now(); requestAnimationFrame(loop); }); }
});

best = Number(localStorage.getItem("rewindrunner-best") || 0);
level = 0;
resize();
</script>
</body>
</html>
