<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Lights Out — Arcade Collection</title>
<link rel="stylesheet" href="../../shared/style.css" />
<style>
  #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 360px; }
  .cell {
    aspect-ratio: 1/1;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: rgba(255,255,255,0.05);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
    transition: background 0.15s, box-shadow 0.15s;
  }
  .cell.on {
    background: #ffe17d;
    box-shadow: 0 0 18px rgba(255,225,125,0.7), inset 0 0 0 2px rgba(255,225,125,0.9);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-link" href="../../index.html">&larr; Arcade</a>
    <h1 class="game-title">LIGHTS OUT</h1>
    <button class="back-link" id="muteBtn">Mute</button>
  </div>
  <div class="hud">
    <div>MOVES <strong id="moves">0</strong></div>
    <div>BEST <strong id="best">&mdash;</strong></div>
  </div>
  <div class="controls">
    <button class="btn secondary" data-diff="12">Easy</button>
    <button class="btn" data-diff="20">Normal</button>
    <button class="btn secondary" data-diff="32">Hard</button>
  </div>
  <div class="stage" id="stage" style="min-height:400px;">
    <div id="grid"></div>
    <div class="overlay" id="overlay">
      <h2>LIGHTS OUT</h2>
      <p>Clicking a tile toggles it and its neighbors. Turn every light off to win.</p>
      <button class="btn" id="startBtn">Start</button>
    </div>
  </div>
</div>
<script src="../../shared/sound.js"></script>
<script>
const SIZE = 5;
const gridEl = document.getElementById("grid");
const overlay = document.getElementById("overlay");
const movesEl = document.getElementById("moves");
const bestEl = document.getElementById("best");
const muteBtn = document.getElementById("muteBtn");

let cells, moves, running, best;

function makeGrid() { return Array.from({ length: SIZE }, () => Array(SIZE).fill(false)); }

function toggle(grid, r, c) {
  const spots = [[r, c], [r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]];
  for (const [rr, cc] of spots) {
    if (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE) grid[rr][cc] = !grid[rr][cc];
  }
}

function isSolved(grid) { return grid.every((row) => row.every((v) => !v)); }

function scramble(grid, steps) {
  for (let i = 0; i < steps; i++) {
    toggle(grid, Math.floor(Math.random() * SIZE), Math.floor(Math.random() * SIZE));
  }
  if (isSolved(grid)) toggle(grid, Math.floor(Math.random() * SIZE), Math.floor(Math.random() * SIZE));
}

function buildGrid() {
  gridEl.innerHTML = "";
  const btns = [];
  for (let r = 0; r < SIZE; r++) {
    const row = [];
    for (let c = 0; c < SIZE; c++) {
      const btn = document.createElement("button");
      btn.className = "cell";
      btn.addEventListener("click", () => onCellClick(r, c));
      gridEl.appendChild(btn);
      row.push(btn);
    }
    btns.push(row);
  }
  return btns;
}

function render() {
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    cells[r][c].classList.toggle("on", state[r][c]);
  }
  movesEl.textContent = moves;
  bestEl.textContent = best ? best : "—";
}

function onCellClick(r, c) {
  if (!running) return;
  toggle(state, r, c);
  moves++;
  Sound.click();
  render();
  if (isSolved(state)) win();
}

function win() {
  running = false;
  Sound.win();
  if (!best || moves < best) { best = moves; localStorage.setItem("lightsout-best", String(best)); }
  overlay.innerHTML = `<h2>Lights Out!</h2><p>Solved in ${moves} move${moves===1?"":"s"}${moves===best?" — New best!":""}</p><button class="btn" id="startBtn2">Play Again</button>`;
  overlay.style.display = "flex";
  document.getElementById("startBtn2").addEventListener("click", () => start(lastDiff));
  render();
}

let lastDiff = 20;
function start(diff) {
  Sound.init();
  lastDiff = diff;
  overlay.style.display = "none";
  state = makeGrid();
  scramble(state, diff);
  moves = 0;
  running = true;
  render();
}

document.querySelectorAll("[data-diff]").forEach((b) => b.addEventListener("click", () => start(Number(b.dataset.diff))));
document.getElementById("startBtn").addEventListener("click", () => start(20));
muteBtn.addEventListener("click", () => {
  Sound.setMuted(!Sound.isMuted());
  muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";
});
muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";

let state;
best = Number(localStorage.getItem("lightsout-best") || 0) || null;
cells = buildGrid();
state = makeGrid();
render();
</script>
<script src="../../shared/ads.js"></script>
</body>
</html>
