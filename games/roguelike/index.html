<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Descent — Arcade Collection</title>
<link rel="stylesheet" href="../../shared/style.css" />
<style>
  #stage { aspect-ratio: 15/11; width: 100%; max-width: 560px; touch-action: none; }
  #hpbar, #xpbar { width: 100%; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
  #hpfill { height: 100%; background: linear-gradient(90deg,#ff5c6c,#ff9a62); width: 100%; transition: width 0.2s; }
  #xpfill { height: 100%; background: linear-gradient(90deg,#4fd1ff,#7cf7c9); width: 0%; transition: width 0.2s; }
  .statline { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 3px; }
  #log { width: 100%; max-width: 560px; height: 80px; overflow-y: auto; background: rgba(255,255,255,0.04); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--text-dim); display: flex; flex-direction: column-reverse; }
  .touch-controls { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 6px; }
  .touch-controls button { border: 1px solid var(--panel-border); background: var(--panel); color: var(--text); border-radius: 8px; font-size: 16px; }
  @media (min-width: 640px) { .touch-controls { display: none; } }
  .action-row { display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-link" href="../../index.html">&larr; Arcade</a>
    <h1 class="game-title">DESCENT</h1>
    <button class="back-link" id="muteBtn">Mute</button>
  </div>
  <div class="hud">
    <div>FLOOR <strong id="floor">1</strong></div>
    <div>LV <strong id="lvl">1</strong></div>
    <div>GOLD <strong id="gold">0</strong></div>
    <div>BEST FLOOR <strong id="best">0</strong></div>
  </div>
  <div style="width:100%; max-width:560px;">
    <div class="statline"><span>HP <span id="hpText">20/20</span></span><span>ATK <span id="atkText">4</span> / DEF <span id="defText">1</span></span></div>
    <div id="hpbar"><div id="hpfill"></div></div>
    <div class="statline" style="margin-top:6px;"><span>XP <span id="xpText">0/20</span></span></div>
    <div id="xpbar"><div id="xpfill"></div></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <h2>DESCENT</h2>
      <p>Arrow keys / WASD to move &mdash; walk into enemies to attack. H to drink a potion, Space to wait. Reach the stairs to descend. Permadeath.</p>
      <button class="btn" id="startBtn">Descend</button>
    </div>
  </div>
  <div class="action-row">
    <div class="touch-controls" id="pad">
      <span></span><button data-d="up">&uarr;</button><span></span>
      <button data-d="left">&larr;</button><button data-d="wait">&middot;</button><button data-d="right">&rarr;</button>
      <span></span><button data-d="down">&darr;</button><span></span>
    </div>
    <button class="btn secondary" id="potionBtn">Drink Potion (<span id="potCount">0</span>)</button>
  </div>
  <div id="log"></div>
</div>
<script src="../../shared/sound.js"></script>
<script>
const MAP_W = 44, MAP_H = 26;
const VIEW_X = 15, VIEW_Y = 11;
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const logEl = document.getElementById("log");
const muteBtn = document.getElementById("muteBtn");

const ENEMY_TYPES = [
  { key: "rat", name: "Rat", hp: 8, atk: 3, def: 0, xp: 5, color: "#9ad19a", ch: "r", minFloor: 1 },
  { key: "goblin", name: "Goblin", hp: 14, atk: 5, def: 1, xp: 10, color: "#7cf7c9", ch: "g", minFloor: 1 },
  { key: "orc", name: "Orc", hp: 22, atk: 8, def: 2, xp: 20, color: "#ff9a62", ch: "o", minFloor: 3 },
  { key: "troll", name: "Troll", hp: 36, atk: 12, def: 4, xp: 40, color: "#ff5c6c", ch: "T", minFloor: 5 },
];

let map, discovered, rooms, player, enemies, items, floorNum, best, running, gameOver;
let dpr, tilePx;

function rnd(n) { return Math.floor(Math.random() * n); }
function rndRange(a, b) { return a + rnd(b - a + 1); }

function emptyMap() {
  return Array.from({ length: MAP_H }, () => Array(MAP_W).fill(0));
}

function rectsOverlap(a, b, pad) {
  return a.x - pad < b.x + b.w && a.x + a.w + pad > b.x && a.y - pad < b.y + b.h && a.y + a.h + pad > b.y;
}

function generateFloor(n) {
  map = emptyMap();
  rooms = [];
  const attempts = 60;
  for (let i = 0; i < attempts && rooms.length < 10; i++) {
    const w = rndRange(4, 8), h = rndRange(3, 6);
    const x = rndRange(1, MAP_W - w - 2), y = rndRange(1, MAP_H - h - 2);
    const room = { x, y, w, h };
    if (rooms.some((r) => rectsOverlap(r, room, 1))) continue;
    rooms.push(room);
    for (let ry = y; ry < y + h; ry++) for (let rx = x; rx < x + w; rx++) map[ry][rx] = 1;
  }
  for (let i = 1; i < rooms.length; i++) {
    const a = center(rooms[i - 1]), b = center(rooms[i]);
    if (Math.random() < 0.5) { carveH(a.x, b.x, a.y); carveV(a.y, b.y, b.x); }
    else { carveV(a.y, b.y, a.x); carveH(a.x, b.x, b.y); }
  }

  const start = rooms[0];
  let stairsRoom = rooms[0], maxDist = -1;
  for (const r of rooms) {
    const d = Math.hypot(r.x - start.x, r.y - start.y);
    if (d > maxDist) { maxDist = d; stairsRoom = r; }
  }
  const stairsPos = center(stairsRoom);
  map[stairsPos.y][stairsPos.x] = 2;

  discovered = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(false));

  const spawnPos = center(start);
  if (!player) {
    player = { x: spawnPos.x, y: spawnPos.y, hp: 20, maxHp: 20, atk: 4, def: 1, level: 1, xp: 0, xpNext: 20, potions: 1, kills: 0 };
  } else {
    player.x = spawnPos.x; player.y = spawnPos.y;
  }

  enemies = [];
  items = [];
  for (let i = 1; i < rooms.length; i++) {
    const r = rooms[i];
    const enemyCount = rndRange(0, 2);
    for (let k = 0; k < enemyCount; k++) {
      const pos = randomFloorInRoom(r);
      if (!pos || occupied(pos.x, pos.y)) continue;
      const pool = ENEMY_TYPES.filter((t) => t.minFloor <= n);
      const t = pool[rnd(pool.length)];
      enemies.push({ ...t, x: pos.x, y: pos.y, hp: t.hp, maxHp: t.hp, alive: true });
    }
    if (Math.random() < 0.55) {
      const pos = randomFloorInRoom(r);
      if (pos && !occupied(pos.x, pos.y)) items.push({ x: pos.x, y: pos.y, type: "gold", amount: rndRange(5, 15) });
    }
    if (Math.random() < 0.3) {
      const pos = randomFloorInRoom(r);
      if (pos && !occupied(pos.x, pos.y)) items.push({ x: pos.x, y: pos.y, type: "potion" });
    }
    if (Math.random() < 0.18) {
      const pos = randomFloorInRoom(r);
      if (pos && !occupied(pos.x, pos.y)) items.push({ x: pos.x, y: pos.y, type: "shard" });
    }
  }

  updateVisibility();
}

function occupied(x, y) {
  return (player.x === x && player.y === y) || enemies.some((e) => e.alive && e.x === x && e.y === y);
}

function randomFloorInRoom(r) {
  for (let i = 0; i < 20; i++) {
    const x = rndRange(r.x, r.x + r.w - 1), y = rndRange(r.y, r.y + r.h - 1);
    if (map[y][x] === 1) return { x, y };
  }
  return null;
}

function center(r) { return { x: Math.floor(r.x + r.w / 2), y: Math.floor(r.y + r.h / 2) }; }
function carveH(x1, x2, y) { for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) map[y][x] = map[y][x] || 1; }
function carveV(y1, y2, x) { for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) map[y][x] = map[y][x] || 1; }

function updateVisibility() {
  const R = 6;
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
    const x = player.x + dx, y = player.y + dy;
    if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) continue;
    if (Math.hypot(dx, dy) <= R) discovered[y][x] = true;
  }
}

function inMap(x, y) { return x >= 0 && x < MAP_W && y >= 0 && y < MAP_H; }
function isWalkable(x, y) { return inMap(x, y) && map[y][x] !== 0; }

function bfsNextStep(from, to) {
  if (from.x === to.x && from.y === to.y) return null;
  const key = (x, y) => y * MAP_W + x;
  const visited = new Set([key(from.x, from.y)]);
  const queue = [[from.x, from.y, []]];
  const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  let head = 0;
  while (head < queue.length) {
    const [cx, cy, path] = queue[head++];
    if (cx === to.x && cy === to.y) return path[0] || null;
    if (path.length > 25) continue;
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy;
      if (!isWalkable(nx, ny)) continue;
      if (enemies.some((e) => e.alive && e.x === nx && e.y === ny && !(nx === to.x && ny === to.y))) continue;
      const k = key(nx, ny);
      if (visited.has(k)) continue;
      visited.add(k);
      queue.push([nx, ny, [...path, { x: nx, y: ny }]]);
    }
  }
  return null;
}

function log(msg, cls) {
  const div = document.createElement("div");
  if (cls) div.style.color = cls;
  div.textContent = msg;
  logEl.prepend(div);
  while (logEl.children.length > 40) logEl.removeChild(logEl.lastChild);
}

function damage(atk, def) { return Math.max(1, atk + rnd(4) - def); }

function playerAttack(enemy) {
  const dmg = damage(player.atk, enemy.def);
  enemy.hp -= dmg;
  Sound.click();
  log(`You hit the ${enemy.name} for ${dmg}.`);
  if (enemy.hp <= 0) {
    enemy.alive = false;
    player.xp += enemy.xp;
    player.kills++;
    Sound.coin();
    log(`${enemy.name} slain! +${enemy.xp} XP`, "#7cf7c9");
    while (player.xp >= player.xpNext) {
      player.xp -= player.xpNext;
      player.level++;
      player.maxHp += 10;
      player.hp = Math.min(player.maxHp, player.hp + 10);
      player.atk += 2;
      player.def += 1;
      player.xpNext = player.level * 20;
      Sound.win();
      log(`Level up! Now level ${player.level}.`, "#ffe17d");
    }
  }
}

function enemyAttack(enemy) {
  const dmg = damage(enemy.atk, player.def);
  player.hp -= dmg;
  Sound.bad();
  log(`${enemy.name} hits you for ${dmg}.`, "#ff9a62");
  if (player.hp <= 0) { player.hp = 0; endRun(); }
}

function tryMovePlayer(dx, dy) {
  if (!running || gameOver) return;
  const nx = player.x + dx, ny = player.y + dy;
  if (dx === 0 && dy === 0) { enemyTurns(); return; }
  const enemy = enemies.find((e) => e.alive && e.x === nx && e.y === ny);
  if (enemy) { playerAttack(enemy); enemyTurns(); return; }
  if (!isWalkable(nx, ny)) return;
  player.x = nx; player.y = ny;

  const itemIdx = items.findIndex((it) => it.x === nx && it.y === ny);
  if (itemIdx !== -1) {
    const it = items[itemIdx];
    if (it.type === "gold") { player.gold = (player.gold || 0) + it.amount; Sound.coin(); log(`Found ${it.amount} gold.`, "#ffe17d"); }
    else if (it.type === "potion") { player.potions++; Sound.good(); log("Found a potion."); }
    else if (it.type === "shard") { player.atk += 1; Sound.win(); log("Power shard absorbed. ATK +1.", "#c77dff"); }
    items.splice(itemIdx, 1);
  }

  if (map[ny][nx] === 2) {
    Sound.win();
    floorNum++;
    log(`Descending to floor ${floorNum}...`, "#4fd1ff");
    generateFloor(floorNum);
    render();
    return;
  }

  updateVisibility();
  enemyTurns();
}

function enemyTurns() {
  for (const e of enemies) {
    if (!e.alive) continue;
    const dist = Math.max(Math.abs(e.x - player.x), Math.abs(e.y - player.y));
    if (dist <= 1) { enemyAttack(e); if (player.hp <= 0) { render(); return; } continue; }
    if (dist <= 7) {
      const step = bfsNextStep({ x: e.x, y: e.y }, { x: player.x, y: player.y });
      if (step) { e.x = step.x; e.y = step.y; }
    }
  }
  updateVisibility();
  render();
}

function drinkPotion() {
  if (!running || gameOver || player.potions <= 0) return;
  player.potions--;
  const heal = Math.round(player.maxHp * 0.5);
  player.hp = Math.min(player.maxHp, player.hp + heal);
  Sound.good();
  log(`Drank a potion, healed ${heal}.`, "#7cf7c9");
  enemyTurns();
}

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + "px";
  canvas.style.height = rect.height + "px";
  tilePx = rect.width / VIEW_X;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  render();
}
window.addEventListener("resize", resize);

function render() {
  if (!map) return;
  const viewW = canvas.width / dpr, viewH = canvas.height / dpr;
  ctx.clearRect(0, 0, viewW, viewH);
  ctx.fillStyle = "#05061a";
  ctx.fillRect(0, 0, viewW, viewH);

  let camX = player.x - Math.floor(VIEW_X / 2);
  let camY = player.y - Math.floor(VIEW_Y / 2);
  camX = Math.max(0, Math.min(MAP_W - VIEW_X, camX));
  camY = Math.max(0, Math.min(MAP_H - VIEW_Y, camY));

  for (let vy = 0; vy < VIEW_Y; vy++) {
    for (let vx = 0; vx < VIEW_X; vx++) {
      const x = camX + vx, y = camY + vy;
      if (!inMap(x, y) || !discovered[y][x]) continue;
      const visible = Math.hypot(x - player.x, y - player.y) <= 6;
      const tile = map[y][x];
      let color = tile === 0 ? "#0c1030" : tile === 2 ? "#3d2f6b" : "#1c2550";
      if (!visible) color = tile === 0 ? "#08091f" : tile === 2 ? "#221c38" : "#12162e";
      ctx.fillStyle = color;
      ctx.fillRect(vx * tilePx, vy * tilePx, tilePx + 0.5, tilePx + 0.5);
      if (tile === 2 && visible) {
        ctx.fillStyle = "#c77dff";
        ctx.font = `${tilePx * 0.6}px sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("▼", vx * tilePx + tilePx / 2, vy * tilePx + tilePx / 2);
      }
    }
  }

  for (const it of items) {
    const vx = it.x - camX, vy = it.y - camY;
    if (vx < 0 || vx >= VIEW_X || vy < 0 || vy >= VIEW_Y) continue;
    if (!discovered[it.y][it.x] || Math.hypot(it.x - player.x, it.y - player.y) > 6) continue;
    ctx.fillStyle = it.type === "gold" ? "#ffe17d" : it.type === "potion" ? "#7cf7c9" : "#c77dff";
    ctx.beginPath();
    ctx.arc(vx * tilePx + tilePx / 2, vy * tilePx + tilePx / 2, tilePx * 0.18, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    const vx = e.x - camX, vy = e.y - camY;
    if (vx < 0 || vx >= VIEW_X || vy < 0 || vy >= VIEW_Y) continue;
    if (!discovered[e.y][e.x] || Math.hypot(e.x - player.x, e.y - player.y) > 6) continue;
    ctx.fillStyle = e.color;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 6;
    ctx.font = `bold ${tilePx * 0.62}px sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(e.ch, vx * tilePx + tilePx / 2, vy * tilePx + tilePx / 2);
    ctx.shadowBlur = 0;
    const hpFrac = e.hp / e.maxHp;
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.fillRect(vx * tilePx + 2, vy * tilePx + 2, tilePx - 4, 3);
    ctx.fillStyle = "#ff5c6c";
    ctx.fillRect(vx * tilePx + 2, vy * tilePx + 2, (tilePx - 4) * hpFrac, 3);
  }

  const pvx = player.x - camX, pvy = player.y - camY;
  ctx.fillStyle = "#4fd1ff";
  ctx.shadowColor = "#4fd1ff";
  ctx.shadowBlur = 10;
  ctx.font = `bold ${tilePx * 0.7}px sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("@", pvx * tilePx + tilePx / 2, pvy * tilePx + tilePx / 2);
  ctx.shadowBlur = 0;

  document.getElementById("floor").textContent = floorNum;
  document.getElementById("lvl").textContent = player.level;
  document.getElementById("gold").textContent = player.gold || 0;
  document.getElementById("hpText").textContent = `${player.hp}/${player.maxHp}`;
  document.getElementById("atkText").textContent = player.atk;
  document.getElementById("defText").textContent = player.def;
  document.getElementById("xpText").textContent = `${player.xp}/${player.xpNext}`;
  document.getElementById("hpfill").style.width = Math.max(0, (player.hp / player.maxHp) * 100) + "%";
  document.getElementById("xpfill").style.width = (player.xp / player.xpNext) * 100 + "%";
  document.getElementById("potCount").textContent = player.potions;
  document.getElementById("best").textContent = best;
}

function endRun() {
  running = false;
  gameOver = true;
  Sound.bad();
  if (floorNum > best) { best = floorNum; localStorage.setItem("descent-best", String(best)); }
  log("You have died.", "#ff5c6c");
  overlay.innerHTML = `<h2>You Died</h2><p>Reached floor ${floorNum}, level ${player.level}, ${player.kills} kills, ${player.gold || 0} gold.</p><button class="btn" id="startBtn2">Descend Again</button>`;
  overlay.style.display = "flex";
  document.getElementById("startBtn2").addEventListener("click", start);
  render();
}

function start() {
  Sound.init();
  overlay.style.display = "none";
  player = null;
  floorNum = 1;
  running = true;
  gameOver = false;
  logEl.innerHTML = "";
  generateFloor(1);
  player.gold = 0;
  log("You descend into the dungeon.");
  render();
}

window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (["arrowup","arrowdown","arrowleft","arrowright"," ","w","a","s","d","h"].includes(k)) e.preventDefault();
  if (k === "arrowup" || k === "w") tryMovePlayer(0, -1);
  else if (k === "arrowdown" || k === "s") tryMovePlayer(0, 1);
  else if (k === "arrowleft" || k === "a") tryMovePlayer(-1, 0);
  else if (k === "arrowright" || k === "d") tryMovePlayer(1, 0);
  else if (k === " ") tryMovePlayer(0, 0);
  else if (k === "h") drinkPotion();
});
document.getElementById("pad").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-d]");
  if (!btn) return;
  const map2 = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0], wait: [0, 0] };
  tryMovePlayer(...map2[btn.dataset.d]);
});
document.getElementById("potionBtn").addEventListener("click", drinkPotion);
document.getElementById("startBtn").addEventListener("click", start);
muteBtn.addEventListener("click", () => {
  Sound.setMuted(!Sound.isMuted());
  muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";
});
muteBtn.textContent = Sound.isMuted() ? "Unmute" : "Mute";

best = Number(localStorage.getItem("descent-best") || 0);
floorNum = 1;
resize();
</script>
</body>
</html>
